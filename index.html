<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Kin Bomber Grid Move</title>

<style>
:root{
  --ui: rgba(255,255,255,0.15);
  --glass: rgba(255,255,255,0.08);
}

html,body{
margin:0;
padding:0;
background:#0b0f1a;
overflow:hidden;
font-family:sans-serif;
}

/* GAME */
#wrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

#game{
display:grid;
grid-template-columns:repeat(15,40px);
grid-template-rows:repeat(13,40px);
gap:2px;
}

.cell{width:40px;height:40px;background:#1e293b;}
.wall{background:#475569;}
.block{background:url('monst/block.png');background-size:cover;}

.bomb{
background:url('monst/bomb.png');
background-size:cover;
animation:blink .5s infinite;
}
@keyframes blink{50%{transform:scale(1.2)}}

.explosion{
background:url('monst/explode.png');
background-size:160px 40px;
animation:exp .4s steps(4) forwards;
}
@keyframes exp{to{background-position:-160px}}

.heart{background:url('monst/heart.png');background-size:cover;}

.enemy{
position:absolute;
width:40px;height:40px;
background:url('monst/mushroom.png');
background-size:cover;
z-index:5;
}

#player{
position:absolute;
width:40px;height:40px;
background:url('monst/p1_idle.png');
background-size:160px 40px;
z-index:10;
}

/* HUD */
#hud{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:var(--glass);
padding:8px 16px;
border-radius:20px;
backdrop-filter:blur(10px);
color:white;
}

/* JOY */
#joy{
position:fixed;
left:5vw;
bottom:5vh;
width:20vw;height:20vw;
max-width:140px;max-height:140px;
border-radius:50%;
background:var(--glass);
}
#stick{
width:50%;height:50%;
border-radius:50%;
background:var(--ui);
position:absolute;
left:25%;top:25%;
}

/* BOMB BTN */
#bombBtn{
position:fixed;
right:5vw;
bottom:5vh;
width:18vw;height:18vw;
max-width:90px;max-height:90px;
border-radius:50%;
background:var(--ui);
display:flex;
justify-content:center;
align-items:center;
font-size:6vw;
}
</style>
</head>

<body>

<div id="hud">❤️ 3 | 💣 1</div>

<div id="wrap">
  <div id="game">
    <div id="player"></div>
  </div>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="bombBtn">💣</div>

<script>
const cellSize=40, gap=2, step=cellSize+gap;
const rows=13, cols=15;

let grid=[], enemies=[];
let player={x:1,y:1,hp:3,range:1};

const game=document.getElementById("game");
const p=document.getElementById("player");
const hud=document.getElementById("hud");

/* MAP */
function createMap(){
grid=[];
game.querySelectorAll(".cell").forEach(c=>c.remove());

for(let y=0;y<rows;y++){
let r=[];
for(let x=0;x<cols;x++){
let c=document.createElement("div");
c.className="cell";

if(y===0||x===0||y===rows-1||x===cols-1||(x%2==0&&y%2==0)){
r.push("wall"); c.classList.add("wall");
}else if(Math.random()<0.3){
r.push("block"); c.classList.add("block");
}else{
r.push("empty");
}

game.appendChild(c);
}
grid.push(r);
}
game.appendChild(p);
}

/* PLAYER */
function drawPlayer(){
p.style.transform=`translate(${player.x*step}px,${player.y*step}px)`;
}

/* DAMAGE */
function hit(){
player.hp--;
hud.innerHTML=`❤️ ${player.hp} | 💣 ${player.range}`;
if(player.hp<=0){
alert("Game Over");
location.reload();
}
}

/* ===== GRID MOVE ===== */
let moving=false;
const moveDelay=120;

function move(dir){
if(moving) return;

let nx=Math.round(player.x);
let ny=Math.round(player.y);

if(dir==="up") ny--;
if(dir==="down") ny++;
if(dir==="left") nx--;
if(dir==="right") nx++;

if(grid[ny]?.[nx]==="wall"||grid[ny]?.[nx]==="block") return;

moving=true;

let sx=player.x, sy=player.y;
let tx=nx, ty=ny;
let t=0;

function anim(){
t+=0.2;
player.x=sx+(tx-sx)*t;
player.y=sy+(ty-sy)*t;
drawPlayer();

if(t<1){
requestAnimationFrame(anim);
}else{
player.x=tx;
player.y=ty;
moving=false;
}
}
anim();
}

/* JOYSTICK */
let joy=document.getElementById("joy");
let stick=document.getElementById("stick");

let lastMove=0;

joy.addEventListener("touchmove",e=>{
let now=Date.now();
if(now-lastMove<moveDelay) return;

let r=joy.getBoundingClientRect();
let cx=r.left+r.width/2;
let cy=r.top+r.height/2;

let t=e.touches[0];
let dx=t.clientX-cx;
let dy=t.clientY-cy;

let absX=Math.abs(dx);
let absY=Math.abs(dy);

if(absX>absY){
if(dx>10) move("right");
else if(dx<-10) move("left");
}else{
if(dy>10) move("down");
else if(dy<-10) move("up");
}

lastMove=now;
});

joy.addEventListener("touchend",()=>{
stick.style.transform="translate(0,0)";
});

/* BOMB */
document.getElementById("bombBtn").ontouchstart=()=>{
let x=Math.round(player.x);
let y=Math.round(player.y);

if(grid[y][x]!=="empty")return;

grid[y][x]="bomb";
draw();

setTimeout(()=>{
[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
for(let i=0;i<2;i++){
let nx=x+dx*i,ny=y+dy*i;

if(grid[ny][nx]=="wall")break;

if(grid[ny][nx]=="block"){
grid[ny][nx]=Math.random()<0.2?"heart":"empty";
break;
}

grid[ny][nx]="explosion";

if(Math.round(player.x)==nx && Math.round(player.y)==ny) hit();

enemies=enemies.filter(e=>{
if(e.x===nx&&e.y===ny){e.el.remove();return false;}
return true;
});
}
});
draw();

setTimeout(()=>{
for(let y=0;y<rows;y++)
for(let x=0;x<cols;x++)
if(grid[y][x]=="explosion")grid[y][x]="empty";
draw();
},400);

},1200);
};

/* ENEMY */
function spawnEnemies(n=3){
enemies=[];
document.querySelectorAll(".enemy").forEach(e=>e.remove());

while(enemies.length<n){
let x=Math.floor(Math.random()*cols);
let y=Math.floor(Math.random()*rows);

if(grid[y][x]=="empty" && (x>3||y>3)){
let el=document.createElement("div");
el.className="enemy";
game.appendChild(el);

enemies.push({x,y,el});
}
}
}

setInterval(()=>{
enemies.forEach(e=>{
let dirs=[[1,0],[-1,0],[0,1],[0,-1]];
let r=dirs[Math.floor(Math.random()*4)];
let nx=e.x+r[0],ny=e.y+r[1];

if(grid[ny]?.[nx]=="empty"){
e.x=nx;e.y=ny;
}

e.el.style.transform=`translate(${e.x*step}px,${e.y*step}px)`;

if(Math.round(player.x)==e.x && Math.round(player.y)==e.y){
hit();
}
});
},500);

/* DRAW */
function draw(){
document.querySelectorAll(".cell").forEach((c,i)=>{
c.className="cell";
let x=i%cols,y=Math.floor(i/cols),g=grid[y][x];

if(g==="wall")c.classList.add("wall");
if(g==="block")c.classList.add("block");
if(g==="bomb")c.classList.add("bomb");
if(g==="explosion")c.classList.add("explosion");
if(g==="heart")c.classList.add("heart");
});
}

/* START */
createMap();
spawnEnemies(3);
drawPlayer();
draw();
</script>

</body>
</html>
