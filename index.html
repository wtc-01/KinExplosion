<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Bomberman Mobile Pro</title>

<style>
:root{
  --ui: rgba(255,255,255,0.15);
  --glass: rgba(255,255,255,0.08);
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#0b0f1a;
font-family:sans-serif;
}

/* 🎮 GAME CENTER */
#gameWrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

#game{
display:grid;
grid-template-columns:repeat(15,40px);
grid-template-rows:repeat(13,40px);
gap:2px;
}

/* TILE */
.cell{width:40px;height:40px;background:#1e293b;}
.wall{background:#475569;}
.block{background:url('monst/block.png');background-size:cover;}

.bomb{
background:url('monst/bomb.png');
background-size:cover;
animation:blink .5s infinite;
}

@keyframes blink{
50%{transform:scale(1.2)}
}

/* 💥 EXPLOSION */
.explosion{
background:url('monst/explode.png');
background-size:160px 40px;
animation:exp .4s steps(4) forwards;
}
@keyframes exp{
to{background-position:-160px}
}

.heart{background:url('monst/heart.png');background-size:cover;}

.enemy{
width:40px;height:40px;
position:absolute;
background-size:cover;
z-index:5;
}

#player{
width:40px;height:40px;
background:url('monst/p1_idle.png');
background-size:160px 40px;
position:absolute;
z-index:10;
}

/* 🧊 HUD */
#hud{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:var(--glass);
padding:8px 16px;
border-radius:20px;
backdrop-filter: blur(10px);
font-size:14px;
}

/* 🎮 JOYSTICK */
#joy{
position:fixed;
left:5vw;
bottom:5vh;
width:20vw;height:20vw;
max-width:140px;max-height:140px;
border-radius:50%;
background:var(--glass);
backdrop-filter:blur(8px);
}
#stick{
width:50%;height:50%;
border-radius:50%;
background:var(--ui);
position:absolute;
left:25%;top:25%;
}

/* 💣 BUTTON */
#bombBtn{
position:fixed;
right:5vw;
bottom:5vh;
width:18vw;height:18vw;
max-width:90px;max-height:90px;
border-radius:50%;
background:var(--ui);
display:flex;
justify-content:center;
align-items:center;
font-size:6vw;
backdrop-filter:blur(10px);
}

/* ⛶ FULLSCREEN */
#fullBtn{
position:fixed;
top:10px;
right:10px;
width:45px;height:45px;
border-radius:10px;
background:var(--ui);
display:flex;
justify-content:center;
align-items:center;
}

</style>
</head>

<body>

<div id="hud">❤️ 3 | 💣 1</div>

<div id="gameWrap">
  <div id="game">
    <div id="player"></div>
  </div>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="bombBtn">💣</div>
<div id="fullBtn">⛶</div>

<script>
const rows=13,cols=15,step=42;
let grid=[],enemies=[],bombs=[];
let player={x:1,y:1,hp:3,range:1};

const game=document.getElementById("game");
const wrap=document.getElementById("gameWrap");
const p=document.getElementById("player");
const hud=document.getElementById("hud");

/* 📐 AUTO SCALE */
function scaleGame(){
let w=window.innerWidth;
let h=window.innerHeight;

let baseW=cols*42;
let baseH=rows*42;

let s=Math.min(w/baseW,h/baseH);
s=Math.max(0.6,Math.min(s,1.2));

wrap.style.transform=`translate(-50%,-50%) scale(${s})`;
}
window.addEventListener("resize",scaleGame);

/* MAP */
function map(){
grid=[];game.innerHTML="";
for(let y=0;y<rows;y++){
let r=[];
for(let x=0;x<cols;x++){
let c=document.createElement("div");
c.className="cell";

if(y===0||x===0||y===rows-1||x===cols-1||(x%2==0&&y%2==0)){
r.push("wall");c.classList.add("wall");
}else if(Math.random()<0.3){
r.push("block");c.classList.add("block");
}else r.push("empty");

game.appendChild(c);
}
grid.push(r);
}
game.appendChild(p);
}

/* PLAYER */
function drawPlayer(){
p.style.transform=`translate(${player.x*step}px,${player.y*step}px)`;
}

/* ❤️ DAMAGE */
function hit(){
player.hp--;
hud.innerHTML=`❤️ ${player.hp} | 💣 ${player.range}`;
if(player.hp<=0){alert("Game Over");location.reload();}
}

/* 🎮 ANALOG */
let vx=0,vy=0;

function loop(){
let nx=player.x+vx;
let ny=player.y+vy;

let gx=Math.round(nx);
let gy=Math.round(ny);

if(grid[gy]?.[gx]!=="wall" && grid[gy]?.[gx]!=="block"){
player.x=nx;player.y=ny;
}

drawPlayer();
requestAnimationFrame(loop);
}
loop();

/* JOY */
let joy=document.getElementById("joy");
let stick=document.getElementById("stick");

joy.addEventListener("touchmove",e=>{
let r=joy.getBoundingClientRect();
let cx=r.left+r.width/2;
let cy=r.top+r.height/2;

let t=e.touches[0];
let dx=t.clientX-cx;
let dy=t.clientY-cy;

let dist=Math.sqrt(dx*dx+dy*dy);
let max=40;
if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}

stick.style.transform=`translate(${dx}px,${dy}px)`;

vx=dx/80;
vy=dy/80;
});

joy.addEventListener("touchend",()=>{
vx=0;vy=0;
stick.style.transform="translate(0,0)";
});

/* 💣 BOMB */
document.getElementById("bombBtn").ontouchstart=()=>{
let x=Math.round(player.x);
let y=Math.round(player.y);

if(grid[y][x]!=="empty")return;

grid[y][x]="bomb";
draw();

setTimeout(()=>{
[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
for(let i=0;i<2;i++){
let nx=x+dx*i,ny=y+dy*i;
if(grid[ny][nx]=="wall")break;

if(grid[ny][nx]=="block"){
grid[ny][nx]=Math.random()<0.2?"heart":"empty";
break;
}

grid[ny][nx]="explosion";

if(Math.round(player.x)==nx&&Math.round(player.y)==ny)hit();
}
});
draw();

setTimeout(()=>{
for(let y=0;y<rows;y++)
for(let x=0;x<cols;x++)
if(grid[y][x]=="explosion")grid[y][x]="empty";
draw();
},400);

},1200);
};

/* DRAW */
function draw(){
document.querySelectorAll(".cell").forEach((c,i)=>{
c.className="cell";
let x=i%cols,y=Math.floor(i/cols),g=grid[y][x];

if(g==="wall")c.classList.add("wall");
if(g==="block")c.classList.add("block");
if(g==="bomb")c.classList.add("bomb");
if(g==="explosion")c.classList.add("explosion");
if(g==="heart")c.classList.add("heart");
});
}

/* START */
map();
drawPlayer();
draw();
scaleGame();
</script>

</body>
</html>
